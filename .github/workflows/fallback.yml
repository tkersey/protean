name: Self-hosted qualification fallback
on:
  workflow_run:
    workflows: [Zig 0.17 qualification]
    types: [completed]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'workflow_dispatch' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Re-run on the Mac's macOS runner when hosted runners never started
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # A job GitHub never assigned to a runner has no runner and no steps.
          unstarted=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" and (.runner_id // 0) == 0 and (.steps | length) == 0)] | length')
          if [ "$unstarted" -eq 0 ]; then
            echo 'Hosted runners started every job; the failure is the candidate'"'"'s.'
            exit 0
          fi
          current=$(gh api "repos/$REPO/commits/$HEAD_BRANCH" --jq .sha)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "$HEAD_BRANCH moved to $current; its own run qualifies it."
            exit 0
          fi
          echo "$unstarted jobs never started on hosted runners; dispatching macOS qualification of $HEAD_SHA."
          gh workflow run zig.yml --repo "$REPO" --ref "$HEAD_BRANCH" -f mac_backup=true
