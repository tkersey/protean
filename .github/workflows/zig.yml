name: Zig 0.17 qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compiler-cache:
        description: Restore dependency and compiler artifacts (disable for a cold run)
        type: boolean
        default: true
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    name: Qualification / ${{ matrix.lane }} / linux-x86_64
    strategy:
      fail-fast: false
      matrix:
        lane: [authoring, owners, owner-adaptive, owner-adaptive-control, owner-support, workspace, workspace-retention, workspace-history, workspace-runtime, workspace-custody, workspace-succession, correspondence, native, native-workspace, native-placement, runtime, runtime-outer, runtime-guest, downstream]
        include:
          - {lane: owners, compiled_profile: owners}
          - {lane: owner-adaptive, compiled_profile: owner-adaptive}
          - {lane: owner-adaptive-control, compiled_profile: owner-adaptive-control}
          - {lane: workspace, compiled_profile: workspace}
          - {lane: workspace-retention, compiled_profile: workspace-retention}
          - {lane: workspace-history, compiled_profile: workspace-history}
          - {lane: workspace-runtime, compiled_profile: workspace-runtime}
          - {lane: workspace-custody, compiled_profile: workspace-custody}
          - {lane: workspace-succession, compiled_profile: workspace-succession}
          - {lane: native, compiled_profile: product}
          - {lane: native-workspace, product_consumer: true}
          - {lane: native-placement, compiled_profile: product}
          - {lane: runtime, product_consumer: true}
          - {lane: runtime-outer, product_consumer: true}
          - {lane: runtime-guest, product_consumer: true}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ZIG_DEBUG_CMD: '1'
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/global
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - if: ${{ !matrix.product_consumer }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.0'
          mirror: https://zigmirror.com
          use-tool-cache: true
          use-cache: false
      - name: Restore complete compiler cache
        id: cache
        if: ${{ !matrix.product_consumer && (github.event_name != 'workflow_dispatch' || inputs.compiler-cache) }}
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .zig-cache-upload
          key: zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.compiled_profile == 'product' && 'native' || (matrix.lane == 'runtime-outer' && 'runtime-guest' || matrix.lane) }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.compiled_profile == 'product' && 'native' || (matrix.lane == 'runtime-outer' && 'runtime-guest' || matrix.lane) }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}-
            zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-runtime-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}-
            zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ (matrix.lane == 'runtime-outer' || matrix.lane == 'runtime-guest') && 'correspondence' || 'authoring' }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}-
            zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.compiled_profile == 'product' && 'native' || (matrix.lane == 'runtime-outer' && 'runtime-guest' || matrix.lane) }}-
            zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-
      - name: Prepare compiler scratch and native isolation tools
        run: |
          if [ -d .zig-cache-upload ]; then
            test ! -e .zig-cache
            mv .zig-cache-upload .zig-cache
          fi
          mkdir -p .zig-cache/tmp
          lane="${{ matrix.lane }}"
          packages=()
          command -v rg >/dev/null || packages+=(ripgrep)
          if [[ "$lane" == native* ]] || [[ "$lane" == runtime* ]] || [ "$lane" = downstream ]; then
            test -x /usr/bin/bwrap || packages+=(bubblewrap)
            test -x /usr/bin/strace || packages+=(strace)
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            if ! sudo apt-get install --yes --no-install-recommends "${packages[@]}"; then
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends "${packages[@]}"
            fi
          fi
          if [[ "$lane" == native* ]] || [[ "$lane" == runtime* ]] || [ "$lane" = downstream ]; then
            /usr/bin/bwrap --unshare-user --ro-bind / / /usr/bin/true
          fi
      - name: Check source inventory
        if: matrix.lane == 'authoring'
        run: sh tools/check_zig_paths.sh
      - name: Restore locked native transport bytes
        if: ${{ !matrix.product_consumer && (github.event_name != 'workflow_dispatch' || inputs.compiler-cache) }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .protean-native/inputs/*.tar.gz
            .protean-native/inputs/*.zip
          key: protean-native-archives-v2-${{ matrix.lane }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}
      - name: Authenticate and provision selected native inputs
        if: ${{ !matrix.product_consumer && matrix.lane != 'downstream' }}
        run: |
          zig run tools/native/dependencies.zig -- setup \
            conformance/protean/dependencies.lock.json \
            conformance/protean/native-dependencies.lock.json \
            .protean-native/inputs "$(command -v zig)"
      - name: Identify complete compiled qualification inputs
        id: deployment_inputs
        if: matrix.compiled_profile
        run: |
          # Keep all committed inputs except the audited top-level prose that
          # no build reads. Embedded Markdown under examples remains an input.
          # Compiler metadata is normalized; names, modes and bytes are retained.
          compiler_root="$(dirname "$(realpath "$(command -v zig)")")"
          compiler=$(tar -C "$compiler_root" --sort=name --mtime=@0 \
            --owner=0 --group=0 --numeric-owner --dereference -cf - zig lib LICENSE \
            | sha256sum | cut -d' ' -f1)
          profile="${{ matrix.compiled_profile }}"
          inputs=$(node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const tree = execFileSync('git', ['ls-tree', '-r', '-z', 'HEAD']);
          const hash = createHash('sha256');
          const prose = ['README.md', 'AGENTS.md'].map(value => Buffer.from(value));
          for (let start = 0, end; (end = tree.indexOf(0, start)) >= 0; start = end + 1) {
            const record = tree.subarray(start, end);
            const path = record.subarray(record.indexOf(9) + 1);
            if (path.subarray(0, 5).equals(Buffer.from('docs/')) || prose.some(value => path.equals(value))) continue;
            hash.update(record).update(Buffer.from([0]));
          }
          console.log(hash.digest('hex'));
          JS
          )
          echo "key=protean-compiled-v2-$RUNNER_OS-$RUNNER_ARCH-safe-$profile-$inputs-$compiler" >> "$GITHUB_OUTPUT"
      - name: Restore exact compiled qualification inputs
        id: deployment_cache
        if: matrix.compiled_profile && (github.event_name != 'workflow_dispatch' || inputs.compiler-cache)
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/protean-qualification
          key: ${{ steps.deployment_inputs.outputs.key }}
      - name: Build compiled qualification inputs
        if: matrix.compiled_profile && steps.deployment_cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          targets=(protean)
          selection=()
          lane="${{ matrix.lane }}"
          case "$lane" in
            owners) targets=(build-native-owner-tasks-check) ;;
            owner-adaptive) targets=(build-native-owner-adaptive-check); selection=(-Dadaptive-owner-group=capture) ;;
            owner-adaptive-control) targets=(build-native-owner-adaptive-check); selection=(-Dadaptive-owner-group=control) ;;
            workspace) targets=(build-workspace-general-check); selection=(-Dworkspace-group=execution) ;;
            workspace-retention) targets=(build-workspace-general-check); selection=(-Dworkspace-group=retention) ;;
            workspace-history) targets=(build-workspace-general-check); selection=(-Dworkspace-group=history) ;;
            workspace-runtime) targets=(build-workspace-runtime-check); selection=(-Druntime-workspace-group=selection) ;;
            workspace-custody) targets=(build-workspace-runtime-check); selection=(-Druntime-workspace-group=custody) ;;
            workspace-succession) targets=(build-workspace-runtime-check); selection=(-Druntime-workspace-group=succession) ;;
          esac
          zig build "${targets[@]}" "${selection[@]}" -Doptimize=safe --summary all \
            --prefix "$RUNNER_TEMP/protean-qualification" --prefix-exe-dir executables \
            2>&1 | tee "$RUNNER_TEMP/$lane-check.log"
      - name: Package completed native product
        if: matrix.compiled_profile == 'product'
        run: node tools/native/qualification_product.mjs pack "$RUNNER_TEMP/protean-qualification"
        env:
          QUALIFICATION_INPUTS: ${{ steps.deployment_inputs.outputs.key }}
          QUALIFICATION_LANE: ${{ matrix.lane }}
      - name: Publish completed native product before independent checks
        if: matrix.compiled_profile == 'product'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ runner.temp }}/native-product-${{ matrix.lane }}-${{ github.run_attempt }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Acquire current-run native product
        if: matrix.product_consumer
        run: node tools/native/qualification_product.mjs receive "$RUNNER_TEMP/protean-qualification"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save completed compiled qualification inputs
        if: matrix.compiled_profile && matrix.lane != 'runtime-outer' && (matrix.compiled_profile != 'product' || matrix.lane == 'native') && steps.deployment_cache.outputs.cache-hit != 'true' && (github.event_name != 'workflow_dispatch' || inputs.compiler-cache)
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/protean-qualification
          key: ${{ steps.deployment_inputs.outputs.key }}
      - name: Retain completed compiler work before deployment
        id: build_cache_size
        if: matrix.compiled_profile && matrix.lane != 'runtime-outer' && (matrix.compiled_profile != 'product' || matrix.lane == 'native') && steps.deployment_cache.outputs.cache-hit != 'true' && (github.event_name != 'workflow_dispatch' || inputs.compiler-cache)
        continue-on-error: true
        run: |
          echo 'save=false' >> "$GITHUB_OUTPUT"
          test -d .zig-cache/o || exit 0
          test -z "$(find .zig-cache ! -type d ! -type f -print -quit)" || exit 0
          test -n "$(find .zig-cache/o -type f -size +0c -print -quit)" || exit 0
          bytes=$(find .zig-cache -type f -printf '%s\n' | awk '{n+=$1} END {printf "%.0f",n}')
          echo "Compiler cache before deployment: $bytes bytes (4 GiB upload maximum)"
          test "$bytes" -le 4294967296 || exit 0
          test ! -e .zig-cache-upload
          cp -al .zig-cache .zig-cache-upload
          echo 'save=true' >> "$GITHUB_OUTPUT"
      - name: Save completed compiler work before deployment
        if: steps.build_cache_size.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .zig-cache-upload
          key: zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build mobility helper before independent authoring checks
        if: matrix.lane == 'authoring'
        run: |
          zig build build-runtime-mobility-peer -Doptimize=safe --summary all \
            --prefix "$RUNNER_TEMP/protean-qualification" --prefix-exe-dir executables
      - name: Retain independently compiled mobility helper
        if: matrix.lane == 'authoring'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-mobility-peer
          path: ${{ runner.temp }}/protean-qualification/verification/runtime-mobility-peer
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Run retained qualification
        run: |
          set -o pipefail
          run_compiled_tests() {
            local log="$RUNNER_TEMP/$1-tests.log"
            "$RUNNER_TEMP/protean-qualification/verification/$1" 2>&1 | tee "$log"
            rg -Fxq "All $2 tests passed." "$log"
          }
          if [ "${{ matrix.lane }}" = authoring ]; then
            zig build check-protean check-native-https \
              -Doptimize=safe --summary all
          elif [ "${{ matrix.lane }}" = owners ]; then
            run_compiled_tests native-owner-tasks 68
          elif [ "${{ matrix.lane }}" = owner-adaptive ]; then
            run_compiled_tests native-owner-adaptive 2
          elif [ "${{ matrix.lane }}" = owner-adaptive-control ]; then
            run_compiled_tests native-owner-adaptive 11
          elif [ "${{ matrix.lane }}" = owner-support ]; then
            zig build check-native-owner-support -Doptimize=safe --summary all
          elif [ "${{ matrix.lane }}" = workspace ]; then
            run_compiled_tests workspace-general 9
          elif [ "${{ matrix.lane }}" = workspace-retention ]; then
            run_compiled_tests workspace-general 3
          elif [ "${{ matrix.lane }}" = workspace-history ]; then
            run_compiled_tests workspace-general 3
          elif [ "${{ matrix.lane }}" = workspace-runtime ]; then
            run_compiled_tests workspace-runtime 3
          elif [ "${{ matrix.lane }}" = workspace-custody ]; then
            run_compiled_tests workspace-runtime 3
          elif [ "${{ matrix.lane }}" = workspace-succession ]; then
            run_compiled_tests workspace-runtime 2
          elif [ "${{ matrix.lane }}" = correspondence ]; then
            zig build check-workspace-semantics -Doptimize=safe --summary all
          elif [ "${{ matrix.lane }}" = downstream ]; then
            # The downstream witness authenticates its own inputs and builds
            # independently, without competing with native tests on one runner.
            node test/protean/installations.mjs .protean-native/inputs \
              > "$RUNNER_TEMP/downstream-identity.json"
            cat "$RUNNER_TEMP/downstream-identity.json"
          else
            lane="${{ matrix.lane }}"
            result=0
            if [ "$lane" = native ] || [ "$lane" = native-workspace ]; then
              group=controls
              if [ "$lane" = native-workspace ]; then group=workspace; fi
              if [ "$result" -eq 0 ]; then
                node test/protean/native_adaptive.mjs \
                  "$RUNNER_TEMP/protean-qualification/executables/protean" \
                  "$RUNNER_TEMP/protean-qualification/protean/adaptive/application.json" \
                  "$RUNNER_TEMP/protean-qualification/protean/adaptive/program.bpi3" "$group" \
                  2>&1 | tee -a "$RUNNER_TEMP/$lane-check.log" || result=$?
              fi
            elif [ "$lane" = native-placement ]; then
              if [ "$result" -eq 0 ]; then
                node test/protean/native_placement.mjs \
                  "$RUNNER_TEMP/protean-qualification/executables/protean" \
                  2>&1 | tee -a "$RUNNER_TEMP/$lane-check.log" || result=$?
              fi
            else
              scenarios='tools-runtime-ordinary,tools-runtime-specialized,tools-runtime-reframe'
              if [ "$lane" = runtime-outer ] || [ "$lane" = runtime-guest ]; then
                scenarios=tools-runtime-mobility
                if [ "$lane" = runtime-guest ]; then scenarios=tools-runtime-guest-mobility; fi
                node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFile} from 'node:child_process';
          import {promisify} from 'node:util';
          import {createHash} from 'node:crypto';
          import {mkdir, writeFile} from 'node:fs/promises';
          import {setTimeout as delay} from 'node:timers/promises';
          const execute = promisify(execFile), repo = process.env.GITHUB_REPOSITORY;
          const api = async path => (await execute('gh', ['api', `repos/${repo}/${path}`], {encoding: 'buffer', maxBuffer: 64 * 1024 * 1024})).stdout;
          let artifact;
          for (let attempt = 0; attempt < 60; attempt++) {
            const artifacts = JSON.parse(await api(`actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?per_page=100`)).artifacts;
            const matches = artifacts.filter(value => value.name === 'runtime-mobility-peer');
            assert(matches.length <= 1);
            if (matches.length === 1) { artifact = matches[0]; break; }
            await delay(1000);
          }
          assert(artifact, 'the current authoring job must publish its verification helper');
          assert.equal(artifact.expired, false);
          assert.equal(String(artifact.workflow_run.id), process.env.GITHUB_RUN_ID);
          const bytes = await api(`actions/artifacts/${artifact.id}/zip`);
          assert.equal(`sha256:${createHash('sha256').update(bytes).digest('hex')}`, artifact.digest);
          const directory = `${process.env.RUNNER_TEMP}/protean-qualification/verification`;
          await mkdir(directory, {recursive: true});
          await writeFile(`${directory}/runtime-mobility-peer`, bytes, {mode: 0o755});
          console.log(`Authenticated current-run mobility helper: ${artifact.digest}`);
          JS
              fi
              if [ "$result" -eq 0 ]; then
                node test/protean/native_runtime.mjs \
                  "$RUNNER_TEMP/protean-qualification/executables/protean" \
                  "$RUNNER_TEMP/protean-qualification/protean/adaptive/application.json" "$scenarios" \
                  "$RUNNER_TEMP/protean-qualification/verification/runtime-mobility-peer" \
                  2>&1 | tee -a "$RUNNER_TEMP/$lane-check.log" || result=$?
              fi
            fi
            test "$result" -eq 0
            node --input-type=module - "$RUNNER_TEMP/protean-qualification/executables/protean" "$RUNNER_TEMP/$lane-check.log" "$RUNNER_TEMP/$lane-identity.json" "$lane" <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {readFileSync, writeFileSync} from 'node:fs';
          const [binary, nativeLog, output, lane] = process.argv.slice(2);
          const manifest = JSON.parse(execFileSync(binary, ['describe-build'], {encoding: 'utf8'}));
          const executions = readFileSync(nativeLog, 'utf8').split('\n').filter(line => line.startsWith('{"native_deployment":')).map(line => JSON.parse(line));
          assert.equal(executions.length, 1, 'every selected deployment qualified');
          for (const execution of executions) {
            assert.equal(execution.passed, true);
            assert.equal(execution.sha256, manifest.artifact_sha256);
          }
          assert.equal(createHash('sha256').update(readFileSync(binary)).digest('hex'), manifest.artifact_sha256);
          const identity = Object.fromEntries(['program_sha256', 'application_assets_sha256', 'dependencies', 'compiler', 'target'].map(key => [key, manifest[key]]));
          writeFileSync(output, JSON.stringify({identity, artifact_sha256: manifest.artifact_sha256}));
          JS
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain independently qualified build identity
        if: startsWith(matrix.lane, 'native') || startsWith(matrix.lane, 'runtime') || matrix.lane == 'downstream'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/${{ matrix.lane }}-identity.json
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Package the executed adaptive application
        if: matrix.lane == 'native'
        run: |
          output="$RUNNER_TEMP/protean-qualification/executables"
          "$output/protean" describe-build > "$output/protean.build.json"
          cp docs/native-single-binary.md "$output/RUNBOOK.md"
          cp examples/adaptive/README.md "$output/ADAPTIVE.md"
          cp tools/native/install.mjs "$output/install.mjs"
          mkdir -p "$output/adaptive-example"
          cp examples/adaptive/adaptive.example.json "$output/adaptive-example/"
          cp -R examples/adaptive/skills "$output/adaptive-example/skills"
          cp -R "$RUNNER_TEMP/protean-qualification/protean/adaptive" "$output/adaptive-program"
          tar -czf "$RUNNER_TEMP/protean-$RUNNER_OS-$RUNNER_ARCH-$GITHUB_SHA.tar.gz" \
            -C "$output" protean protean.build.json install.mjs RUNBOOK.md ADAPTIVE.md adaptive-program adaptive-example
      - name: Retain executed adaptive application
        if: matrix.lane == 'native'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/protean-*.tar.gz
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Admit a complete bounded cache snapshot
        id: cache_size
        if: ${{ !cancelled() && !matrix.product_consumer && matrix.lane != 'runtime-outer' && (matrix.compiled_profile != 'product' || matrix.lane == 'native') && steps.deployment_cache.outputs.cache-hit != 'true' && steps.build_cache_size.outputs.save != 'true' && (github.event_name != 'workflow_dispatch' || inputs.compiler-cache) }}
        continue-on-error: true
        run: |
          echo 'save=false' >> "$GITHUB_OUTPUT"
          test -d .zig-cache/o || exit 0
          test -z "$(find .zig-cache ! -type d ! -type f -print -quit)" || exit 0
          test -n "$(find .zig-cache/o -type f -size +0c -print -quit)" || exit 0
          bytes=$(find .zig-cache -type f -printf '%s\n' | awk '{n+=$1} END {printf "%.0f",n}')
          echo "Compiler cache: $bytes bytes (4 GiB upload maximum)"
          test "$bytes" -le 4294967296 || exit 0
          test ! -e .zig-cache-upload
          cp -al .zig-cache .zig-cache-upload
          echo 'save=true' >> "$GITHUB_OUTPUT"
      - name: Save useful cache without deleting local outputs
        if: ${{ !cancelled() && steps.cache_size.outputs.save == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .zig-cache-upload
          key: zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
  native:
    name: native
    needs: [qualify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete qualification within ten minutes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          QUALIFICATION: ${{ needs.qualify.result }}
        run: |
          test "$QUALIFICATION" = success
          # JSON/hash comparison uses the runner's Node; product checks pin 26.9.0.
          node --version
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFile} from 'node:child_process';
          import {promisify} from 'node:util';
          import {createHash} from 'node:crypto';
          const execute = promisify(execFile), repo = process.env.GH_REPO;
          const api = async path => (await execute('gh', ['api', `repos/${repo}/${path}`], {encoding: 'buffer'})).stdout;
          const artifacts = JSON.parse(await api(`actions/runs/${process.env.RUN_ID}/artifacts?per_page=100`)).artifacts;
          const load = async lane => {
            const matches = artifacts.filter(value => value.name === `${lane}-identity.json`);
            assert.equal(matches.length, 1);
            const artifact = matches[0];
            assert.equal(artifact.expired, false);
            const bytes = await api(`actions/artifacts/${artifact.id}/zip`);
            assert.equal(`sha256:${createHash('sha256').update(bytes).digest('hex')}`, artifact.digest);
            return JSON.parse(bytes);
          };
          const [native, downstream, ...runtimes] = await Promise.all([
            'native', 'downstream', 'native-workspace', 'native-placement',
            'runtime', 'runtime-outer', 'runtime-guest',
          ].map(load));
          for (const key of ['program_sha256', 'application_assets_sha256', 'dependencies', 'compiler', 'target']) {
            assert.notEqual(native.identity[key], undefined, key);
            assert.deepEqual(downstream.identity[key], native.identity[key], key);
            for (const runtime of runtimes) assert.deepEqual(runtime.identity[key], native.identity[key], key);
          }
          assert.notEqual(native.artifact_sha256, undefined);
          for (const runtime of runtimes) assert.equal(runtime.artifact_sha256, native.artifact_sha256, 'runtime scenarios executed the packaged native binary');
          console.log('Independent native, runtime and downstream build identities agree.');
          JS
          started="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .run_started_at)"
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "Complete workflow before terminal gate: ${elapsed}s (maximum 600s)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -le 600
