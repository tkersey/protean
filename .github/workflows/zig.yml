name: Zig 0.17 qualification
run-name: ${{ inputs.diagnostic_lane && inputs.diagnostic_lane != 'all' && format('Diagnostic {0}', inputs.diagnostic_lane) || 'Full qualification' }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic_lane:
        description: Run one existing lane for diagnosis; only all qualifies the complete product
        type: choice
        default: all
        options: [all, authoring, owners, downstream, retained-runtime]
      baseline_artifact:
        description: Retained-runtime diagnostic baseline product artifact ID
        type: string
      baseline_sha256:
        description: SHA-256 of the baseline product archive
        type: string
      candidate_artifact:
        description: Retained-runtime diagnostic candidate product artifact ID
        type: string
      candidate_sha256:
        description: SHA-256 of the candidate product archive
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic_lane != 'retained-runtime' }}
    name: Qualification / ${{ matrix.lane }} / linux-x86_64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.diagnostic_lane == 'authoring' && '[{"lane":"authoring"}]' || github.event_name == 'workflow_dispatch' && inputs.diagnostic_lane == 'owners' && '[{"lane":"owners","compiled_profile":"owners"}]' || github.event_name == 'workflow_dispatch' && inputs.diagnostic_lane == 'downstream' && '[{"lane":"downstream"}]' || '[{"lane":"authoring"},{"lane":"owners","compiled_profile":"owners"},{"lane":"owner-adaptive-control","compiled_profile":"owner-adaptive-control"},{"lane":"owner-support"},{"lane":"workspace","compiled_profile":"workspace"},{"lane":"workspace-retention","compiled_profile":"workspace-retention"},{"lane":"workspace-history","compiled_profile":"workspace-history"},{"lane":"correspondence"},{"lane":"native","compiled_profile":"product"},{"lane":"native-placement","product_consumer":true},{"lane":"downstream"}]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ZIG_DEBUG_CMD: '1'
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/global
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - if: ${{ !matrix.product_consumer }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.0'
          mirror: https://zigmirror.com
          use-tool-cache: true
          use-cache: false
      - name: Identify complete compiled qualification inputs
        id: deployment_inputs
        if: matrix.compiled_profile
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/protean-input-key/global
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/protean-input-key/local
        run: |
          compiler_root="$(dirname "$(realpath "$(command -v zig)")")"
          compiler=$(tar -C "$compiler_root" --sort=name --mtime=@0 \
            --owner=0 --group=0 --numeric-owner --dereference -cf - zig lib LICENSE \
            | sha256sum | cut -d' ' -f1)
          key=$(node tools/native/qualification_build.mjs key "${{ matrix.compiled_profile }}" "$compiler")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore exact compiled qualification inputs
        id: deployment_cache
        if: matrix.compiled_profile
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/protean-qualification
          key: ${{ steps.deployment_inputs.outputs.key }}
      - name: Validate restored compiled qualification inputs
        id: compiled
        if: matrix.compiled_profile
        run: |
          valid=false
          if [ "${{ steps.deployment_cache.outputs.cache-hit }}" = true ]; then
            if node tools/native/qualification_build.mjs verify "${{ matrix.compiled_profile }}" \
                "$RUNNER_TEMP/protean-qualification" "${{ steps.deployment_inputs.outputs.key }}"; then
              valid=true
              echo 'Exact compiled-artifact cache hit; selected checks still execute.'
            else
              echo '::warning::Rejected unusable compiled cache; rebuilding the selected artifact.'
            fi
          else
            echo 'Exact compiled-artifact cache miss; selected artifact will build.'
          fi
          if [ "$valid" != true ]; then rm -rf "$RUNNER_TEMP/protean-qualification"; fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
      - name: Restore complete compiler cache
        id: cache
        if: ${{ !matrix.product_consumer }}
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .zig-cache-upload
          key: zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}-
            ${{ matrix.lane != 'authoring' && format('zig-adaptive-v3-{0}-{1}-0.17.0-{2}-', runner.os, runner.arch, matrix.lane) || '' }}
            ${{ matrix.lane != 'authoring' && format('zig-adaptive-v3-{0}-{1}-0.17.0-', runner.os, runner.arch) || '' }}
      - name: Prepare compiler scratch and native isolation tools
        run: |
          if [ -d .zig-cache-upload ]; then
            test ! -e .zig-cache
            mv .zig-cache-upload .zig-cache
          fi
          mkdir -p .zig-cache/tmp
          lane="${{ matrix.lane }}"
          packages=()
          if [ -z "${{ matrix.compiled_profile }}" ] || [ "${{ matrix.compiled_profile }}" = product ] || [ "$lane" = authoring ]; then
            command -v rg >/dev/null || packages+=(ripgrep)
          fi
          if [[ "$lane" == native* ]] || [ "$lane" = downstream ]; then
            test -x /usr/bin/bwrap || packages+=(bubblewrap)
            test -x /usr/bin/strace || packages+=(strace)
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            if ! sudo apt-get install --yes --no-install-recommends "${packages[@]}"; then
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends "${packages[@]}"
            fi
          fi
          if [[ "$lane" == native* ]] || [ "$lane" = downstream ]; then
            /usr/bin/bwrap --unshare-user --ro-bind / / /usr/bin/true
          fi
      - name: Check source inventory
        if: matrix.lane == 'authoring'
        run: sh tools/check_zig_paths.sh
      - name: Restore locked native transport bytes
        if: ${{ !matrix.product_consumer }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .protean-native/inputs/*.tar.gz
            .protean-native/inputs/*.zip
          key: protean-native-archives-v2-${{ matrix.lane == 'downstream' && 'native' || matrix.lane }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}
      - name: Authenticate and provision selected native inputs
        if: ${{ !matrix.product_consumer && matrix.lane != 'downstream' }}
        run: |
          zig run tools/native/dependencies.zig -- setup \
            conformance/protean/dependencies.lock.json \
            conformance/protean/native-dependencies.lock.json \
            .protean-native/inputs "$(command -v zig)"
      - name: Build compiled qualification inputs
        if: matrix.compiled_profile && steps.compiled.outputs.valid != 'true'
        run: |
          set -o pipefail
          node tools/native/qualification_build.mjs build "${{ matrix.compiled_profile }}" \
            "$RUNNER_TEMP/protean-qualification" 2>&1 | tee "$RUNNER_TEMP/${{ matrix.lane }}-check.log"
          node tools/native/qualification_build.mjs seal "${{ matrix.compiled_profile }}" \
            "$RUNNER_TEMP/protean-qualification" "${{ steps.deployment_inputs.outputs.key }}"
      - name: Package completed native product
        if: matrix.compiled_profile == 'product'
        run: node tools/native/qualification_product.mjs pack "$RUNNER_TEMP/protean-qualification"
        env:
          QUALIFICATION_INPUTS: ${{ steps.deployment_inputs.outputs.key }}
          QUALIFICATION_LANE: ${{ matrix.lane }}
      - name: Publish completed native product before independent checks
        if: matrix.compiled_profile == 'product'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ runner.temp }}/native-product-${{ matrix.lane }}-${{ github.run_attempt }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Acquire current-run native product
        if: matrix.product_consumer
        run: node tools/native/qualification_product.mjs receive "$RUNNER_TEMP/protean-qualification"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save completed compiled qualification inputs
        if: matrix.compiled_profile && steps.compiled.outputs.valid != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/protean-qualification
          key: ${{ steps.deployment_inputs.outputs.key }}
      - name: Retain completed compiler work before deployment
        id: build_cache_size
        if: matrix.compiled_profile && steps.compiled.outputs.valid != 'true'
        continue-on-error: true
        run: |
          echo 'save=false' >> "$GITHUB_OUTPUT"
          test -d .zig-cache/o || exit 0
          test -z "$(find .zig-cache ! -type d ! -type f -print -quit)" || exit 0
          test -n "$(find .zig-cache/o -type f -size +0c -print -quit)" || exit 0
          bytes=$(find .zig-cache -type f -printf '%s\n' | awk '{n+=$1} END {printf "%.0f",n}')
          echo "Compiler cache before deployment: $bytes bytes (4 GiB upload maximum)"
          test "$bytes" -le 4294967296 || exit 0
          test ! -e .zig-cache-upload
          cp -al .zig-cache .zig-cache-upload
          echo 'save=true' >> "$GITHUB_OUTPUT"
      - name: Save completed compiler work before deployment
        if: steps.build_cache_size.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .zig-cache-upload
          key: zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run retained qualification
        run: |
          set -o pipefail
          run_compiled_tests() {
            local log="$RUNNER_TEMP/$1-tests.log"
            /usr/bin/time -v "$RUNNER_TEMP/protean-qualification/verification/$1" 2>&1 | tee "$log"
            grep -Fxq "All $2 tests passed." "$log"
          }
          if [ "${{ matrix.lane }}" = authoring ]; then
            zig build check-protean check-native-https \
              -Doptimize=safe --summary all
          elif [ "${{ matrix.lane }}" = owners ]; then
            run_compiled_tests native-owner-tasks 46
          elif [ "${{ matrix.lane }}" = owner-adaptive-control ]; then
            run_compiled_tests native-owner-adaptive 9
          elif [ "${{ matrix.lane }}" = owner-support ]; then
            zig build check-native-owner-support -Doptimize=safe --summary all
          elif [ "${{ matrix.lane }}" = workspace ]; then
            run_compiled_tests workspace-general 16
          elif [ "${{ matrix.lane }}" = workspace-retention ]; then
            run_compiled_tests workspace-general 3
          elif [ "${{ matrix.lane }}" = workspace-history ]; then
            run_compiled_tests workspace-general 3
          elif [ "${{ matrix.lane }}" = correspondence ]; then
            zig build check-workspace-semantics -Doptimize=safe --summary all
          elif [ "${{ matrix.lane }}" = downstream ]; then
            # The downstream witness authenticates its own inputs and builds
            # independently, without competing with native tests on one runner.
            node test/protean/installations.mjs .protean-native/inputs \
              > "$RUNNER_TEMP/downstream-identity.json"
            cat "$RUNNER_TEMP/downstream-identity.json"
          else
            lane="${{ matrix.lane }}"
            if [ "$lane" = native ]; then
              node test/protean/native_adaptive.mjs \
                "$RUNNER_TEMP/protean-qualification/executables/protean" \
                "$RUNNER_TEMP/protean-qualification/protean/adaptive/application.json" \
                "$RUNNER_TEMP/protean-qualification/protean/adaptive/program.bpi3" smoke \
                2>&1 | tee -a "$RUNNER_TEMP/$lane-check.log"
            elif [ "$lane" = native-placement ]; then
              node test/protean/native_placement.mjs \
                "$RUNNER_TEMP/protean-qualification/executables/protean" \
                2>&1 | tee -a "$RUNNER_TEMP/$lane-check.log"
            else
              echo "Unknown qualification lane: $lane" >&2
              exit 1
            fi
            node --input-type=module - "$RUNNER_TEMP/protean-qualification/executables/protean" "$RUNNER_TEMP/$lane-check.log" "$RUNNER_TEMP/$lane-identity.json" "$lane" <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {readFileSync, writeFileSync} from 'node:fs';
          const [binary, nativeLog, output, lane] = process.argv.slice(2);
          const manifest = JSON.parse(execFileSync(binary, ['describe-build'], {encoding: 'utf8'}));
          const executions = readFileSync(nativeLog, 'utf8').split('\n').filter(line => line.startsWith('{"native_deployment":')).map(line => JSON.parse(line));
          assert.equal(executions.length, 1, 'every selected deployment qualified');
          for (const execution of executions) {
            assert.equal(execution.passed, true);
            assert.equal(execution.sha256, manifest.artifact_sha256);
          }
          assert.equal(createHash('sha256').update(readFileSync(binary)).digest('hex'), manifest.artifact_sha256);
          const identity = Object.fromEntries(['program_sha256', 'application_assets_sha256', 'dependencies', 'compiler', 'target'].map(key => [key, manifest[key]]));
          writeFileSync(output, JSON.stringify({identity, artifact_sha256: manifest.artifact_sha256}));
          JS
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain independently qualified build identity
        if: matrix.lane == 'native' || matrix.lane == 'native-placement' || matrix.lane == 'downstream'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.lane }}-identity.json
          path: ${{ runner.temp }}/${{ matrix.lane }}-identity.json
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Package the executed adaptive application
        if: matrix.lane == 'native'
        run: |
          output="$RUNNER_TEMP/protean-qualification/executables"
          "$output/protean" describe-build > "$output/protean.build.json"
          cp docs/native-single-binary.md "$output/RUNBOOK.md"
          cp examples/adaptive/README.md "$output/ADAPTIVE.md"
          cp tools/native/install.mjs "$output/install.mjs"
          mkdir -p "$output/adaptive-example"
          cp examples/adaptive/adaptive.example.json "$output/adaptive-example/"
          cp -R examples/adaptive/skills "$output/adaptive-example/skills"
          cp -R "$RUNNER_TEMP/protean-qualification/protean/adaptive" "$output/adaptive-program"
          tar -czf "$RUNNER_TEMP/protean-$RUNNER_OS-$RUNNER_ARCH-$GITHUB_SHA.tar.gz" \
            -C "$output" protean protean.build.json install.mjs RUNBOOK.md ADAPTIVE.md adaptive-program adaptive-example
      - name: Retain executed adaptive application
        if: matrix.lane == 'native'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protean-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}.tar.gz
          path: ${{ runner.temp }}/protean-*.tar.gz
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Admit a complete bounded cache snapshot
        id: cache_size
        if: ${{ !cancelled() && !matrix.product_consumer && steps.compiled.outputs.valid != 'true' && steps.build_cache_size.outputs.save != 'true' }}
        continue-on-error: true
        run: |
          echo 'save=false' >> "$GITHUB_OUTPUT"
          objects=.zig-cache/o
          if [ "${{ matrix.lane }}" = downstream ]; then
            objects="$ZIG_GLOBAL_CACHE_DIR/downstream-local/o"
          fi
          test -d "$objects" || exit 0
          test -z "$(find .zig-cache ! -type d ! -type f -print -quit)" || exit 0
          test -n "$(find "$objects" -type f -size +0c -print -quit)" || exit 0
          bytes=$(find .zig-cache -type f -printf '%s\n' | awk '{n+=$1} END {printf "%.0f",n}')
          echo "Compiler cache: $bytes bytes (4 GiB upload maximum)"
          test "$bytes" -le 4294967296 || exit 0
          test ! -e .zig-cache-upload
          cp -al .zig-cache .zig-cache-upload
          echo 'save=true' >> "$GITHUB_OUTPUT"
      - name: Save useful cache without deleting local outputs
        if: ${{ !cancelled() && steps.cache_size.outputs.save == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .zig-cache-upload
          key: zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
  native:
    name: native
    needs: [qualify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete qualification within ten minutes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          QUALIFICATION: ${{ needs.qualify.result }}
          DIAGNOSTIC_LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_lane || 'all' }}
        run: |
          test "$QUALIFICATION" = success
          if [ "$RUN_ATTEMPT" != 1 ]; then
            echo 'Qualification requires the first attempt from the original trigger.'
            exit 1
          fi
          if [ "$DIAGNOSTIC_LANE" != all ]; then
            echo 'A diagnostic lane does not establish complete qualification.'
            exit 1
          fi
          # JSON/hash comparison uses the runner's Node; product checks pin 26.9.0.
          node --version
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFile} from 'node:child_process';
          import {promisify} from 'node:util';
          import {createHash} from 'node:crypto';
          const execute = promisify(execFile), repo = process.env.GH_REPO;
          const api = async path => (await execute('gh', ['api', `repos/${repo}/${path}`], {encoding: 'buffer'})).stdout;
          const artifacts = JSON.parse(await api(`actions/runs/${process.env.RUN_ID}/artifacts?per_page=100`)).artifacts;
          const load = async lane => {
            const matches = artifacts.filter(value => value.name === `${lane}-identity.json`);
            assert.equal(matches.length, 1);
            const artifact = matches[0];
            assert.equal(artifact.expired, false);
            const bytes = await api(`actions/artifacts/${artifact.id}/zip`);
            assert.equal(`sha256:${createHash('sha256').update(bytes).digest('hex')}`, artifact.digest);
            return JSON.parse(bytes);
          };
          const [native, placement, downstream] = await Promise.all(['native', 'native-placement', 'downstream'].map(load));
          for (const key of ['program_sha256', 'application_assets_sha256', 'dependencies', 'compiler', 'target']) {
            assert.notEqual(native.identity[key], undefined, key);
            assert.deepEqual(downstream.identity[key], native.identity[key], key);
            assert.deepEqual(placement.identity[key], native.identity[key], key);
          }
          assert.notEqual(native.artifact_sha256, undefined);
          assert.equal(placement.artifact_sha256, native.artifact_sha256, 'placement executed the packaged native binary');
          console.log('Independent native and downstream build identities agree; placement executed the packaged product.');
          JS
          started="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .created_at)"
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "Complete workflow from original trigger through terminal checks: ${elapsed}s (maximum 600s)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -le 600

  retention:
    name: Historical executable retention diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_lane == 'retained-runtime' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
      - name: Authenticate retained executables and continue the original task
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
          BASELINE_SHA256: ${{ inputs.baseline_sha256 }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          acquire() {
            local label="$1" artifact="$2" digest="$3"
            [[ "$artifact" =~ ^[0-9]+$ ]]
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            mkdir -p "$RUNNER_TEMP/$label"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/$label.tar.gz"
            echo "$digest  $RUNNER_TEMP/$label.tar.gz" | sha256sum --check --strict
            tar -xzf "$RUNNER_TEMP/$label.tar.gz" -C "$RUNNER_TEMP/$label" executables/protean
            test -f "$RUNNER_TEMP/$label/executables/protean"
            test ! -L "$RUNNER_TEMP/$label/executables/protean"
            sha256sum "$RUNNER_TEMP/$label/executables/protean"
          }
          acquire baseline "$BASELINE_ARTIFACT" "$BASELINE_SHA256"
          acquire candidate "$CANDIDATE_ARTIFACT" "$CANDIDATE_SHA256"
          node test/protean/workspace_runtime_retention.mjs \
            "$RUNNER_TEMP/baseline/executables/protean" \
            "$RUNNER_TEMP/candidate/executables/protean"
