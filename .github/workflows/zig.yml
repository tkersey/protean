name: Zig 0.17 qualification
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_backup && 'Full qualification (self-hosted)' || 'Full qualification' }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mac_backup:
        description: Qualify on the Mac's self-hosted macOS runner instead of GitHub-hosted Linux
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  tiger-style:
    name: TigerStyle
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mac_backup) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Enforce TigerStyle on all tracked Zig source
        env:
          TIGER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/tiger-style.sh --all "$TIGER_HEAD"
      - name: Verify TigerStyle selection and failure behavior
        run: bash tools/test-tiger-style.sh
  qualify:
    name: Qualification / ${{ matrix.lane }} / linux-x86_64
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mac_backup) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: authoring
            groups: authoring-https
          - lane: native
            groups: native-smoke,native-placement
            identity: PROTEAN_PRODUCT_IDENTITY
          - lane: direct
            groups: direct-smoke
          - lane: downstream
            groups: downstream
            identity: PROTEAN_DOWNSTREAM_IDENTITY
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ZIG_DEBUG_CMD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-tool-cache: true
          use-cache: false
      - name: Install native isolation tools
        run: |
          packages=()
          command -v rg >/dev/null || packages+=(ripgrep)
          if [ "${{ matrix.lane }}" != authoring ]; then
            test -x /usr/bin/bwrap || packages+=(bubblewrap)
            test -x /usr/bin/strace || packages+=(strace)
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            if ! sudo apt-get install --yes --no-install-recommends "${packages[@]}"; then
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends "${packages[@]}"
            fi
          fi
          if [ "${{ matrix.lane }}" != authoring ]; then
            /usr/bin/bwrap --unshare-user --ro-bind / / /usr/bin/true
          fi
      - name: Qualify ${{ matrix.groups }}
        run: |
          if [ -n "${{ matrix.identity }}" ]; then export "${{ matrix.identity }}=$RUNNER_TEMP/identity.json"; fi
          zig build qualify -- --group "${{ matrix.groups }}"
      - name: Retain the build identity for comparison
        if: matrix.identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-${{ matrix.lane }}
          path: ${{ runner.temp }}/identity.json
          if-no-files-found: error
          retention-days: 1
  macos:
    name: Qualification / macos-arm64
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_backup }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-tool-cache: true
          use-cache: false
      - name: Qualify the essential macOS set
        run: |
          # The runner provides a persistent cache that setup-zig does not know about.
          if [ -n "${PROTEAN_CI_CACHE:-}" ]; then
            export ZIG_GLOBAL_CACHE_DIR="$PROTEAN_CI_CACHE/zig-global" ZIG_LOCAL_CACHE_DIR="$PROTEAN_CI_CACHE/zig-local"
          fi
          zig build qualify
  native:
    # A fallback run reports its own check, so it never stands in for the hosted gate.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_backup && 'macOS fallback' || 'native' }}
    needs: [qualify, tiger-style, macos]
    if: ${{ always() }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_backup && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Collect build identities
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mac_backup) && needs.qualify.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: identity-*
          path: ${{ runner.temp }}/identities
      - name: Require complete qualification within ten minutes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          QUALIFICATION: ${{ needs.qualify.result }}
          TIGER_STYLE: ${{ needs.tiger-style.result }}
          MACOS: ${{ needs.macos.result }}
          MAC_BACKUP: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_backup }}
          IDENTITIES: ${{ runner.temp }}/identities
        run: |
          if [ "$MAC_BACKUP" = true ]; then
            test "$MACOS" = success
          else
            test "$QUALIFICATION" = success
            test "$TIGER_STYLE" = success
            product=$(jq -S . "$IDENTITIES/identity-native/identity.json")
            downstream=$(jq -S . "$IDENTITIES/identity-downstream/identity.json")
            jq -e 'length == 6 and all(.[]; . != null)' <<<"$product" >/dev/null
            if [ "$product" != "$downstream" ]; then
              echo 'The independent downstream build does not match the product identity.'
              diff <(echo "$product") <(echo "$downstream") || true
              exit 1
            fi
            echo 'The independent downstream build matches the product identity.'
          fi
          if [ "$RUN_ATTEMPT" != 1 ]; then
            echo 'Qualification requires the first attempt of its run.'
            exit 1
          fi
          elapsed=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '(now - (.created_at | fromdate)) | floor')
          echo "Complete workflow from trigger through terminal checks: ${elapsed}s (maximum 600s)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -le 600
