name: Time original direct Linux fixture operations
on:
  push:
    branches: [diagnostic/direct-fixture-timing]
permissions:
  contents: read
jobs:
  recurrence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache-upload
          key: fixture-timing-${{ github.sha }}
          restore-keys: |
            zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.1-recurrence-driver-direct-
            zig-adaptive-v3-${{ runner.os }}-${{ runner.arch }}-0.17.1-
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .protean-native/inputs/*.tar.gz
            .protean-native/inputs/*.zip
          key: protean-native-archives-v2-native-${{ hashFiles('conformance/protean/dependencies.lock.json', 'conformance/protean/native-dependencies.lock.json') }}
      - run: |
          if [ -d .zig-cache-upload ]; then mv .zig-cache-upload .zig-cache; fi
          if ! command -v musl-gcc >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            if ! sudo apt-get install --yes --no-install-recommends musl-tools; then
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends musl-tools
            fi
          fi
          zig run -fno-llvm tools/native/dependencies.zig -- setup \
            conformance/protean/dependencies.lock.json conformance/protean/native-dependencies.lock.json \
            .protean-native/inputs "$(command -v zig)"
      - name: Run the complete recovery witness with original limits
        run: |
          lscpu | grep -E "^(Model name|Flags):"
          zig build-obj runtime/native/hash.zig -target x86_64-linux-musl -fno-llvm -O safe -fstrip -femit-bin="$RUNNER_TEMP/hash.o"
          zig build-obj runtime/native/hash_x86.zig -target x86_64-linux-musl -mcpu baseline+sha+avx2 -fno-llvm -O safe -fstrip -femit-bin="$RUNNER_TEMP/sha.o"
          zig build-exe "$RUNNER_TEMP/hash.o" "$RUNNER_TEMP/sha.o" -lc -target x86_64-linux-musl -fno-llvm -O safe -fstrip --dep hash_abi -Mroot=tools/native/sha_probe.zig -Mhash_abi=runtime/native/hash_abi.zig -femit-bin="$RUNNER_TEMP/sha-check"
          "$RUNNER_TEMP/sha-check"
          zig build recurrence-driver -Dtarget=x86_64-linux-musl -Dnative-gcc=musl-gcc -Doptimize=safe --summary all
          node test/protean/recurrence_driver.mjs zig-out/bin/protean-recurrence-driver zig-out/protean/adaptive/application.json
